# DigitalOcean App Platform — Whitelight
# Adjust region/slug after creating the project in the DO control panel.

name: whitelight
region: fra

services:
  - name: api
    github:
      repo: cresdynamics-lang/whitelight
      branch: main
      deploy_on_push: true
    source_dir: whitelight/server
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    routes:
      - path: /api
      - path: /feeds
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: SPACES_ENDPOINT
        scope: RUN_TIME
        type: GENERAL
      - key: SPACES_REGION
        scope: RUN_TIME
        type: GENERAL
      - key: SPACES_BUCKET
        scope: RUN_TIME
        type: GENERAL
      - key: SPACES_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SPACES_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: SPACES_CDN_BASE
        scope: RUN_TIME
        type: GENERAL
      - key: META_PIXEL_ID
        scope: RUN_TIME
        type: GENERAL
      - key: META_ACCESS_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: CORS_ORIGIN
        value: https://whitelightstore.co.ke
        scope: RUN_TIME
        type: GENERAL

static_sites:
  - name: web
    github:
      repo: cresdynamics-lang/whitelight
      branch: main
      deploy_on_push: true
    source_dir: whitelight
    build_command: npm ci && npm run build
    output_dir: dist
    routes:
      - path: /
    envs:
      - key: VITE_API_BASE_URL
        value: ${api.PUBLIC_URL}
        scope: BUILD_TIME
      - key: VITE_META_PIXEL_ID
        scope: BUILD_TIME
        type: GENERAL
      - key: DATABASE_URL
        scope: BUILD_TIME
        type: SECRET
      - key: SPACES_CDN_BASE
        scope: BUILD_TIME
        type: GENERAL
